<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0e0f13">
  <meta name="description" content="Pit Wall: a Formula 1 deck-building roguelike. Build your deck, manage your tyres, win the title.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pit Wall">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Pit Wall</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app"></div>
  <noscript>Pit Wall needs JavaScript to run.</noscript>
  <script src="game.js"></script>
  <script>
    // Offline support (only over http/https, not when opened from a file).
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
